# CfC Architecture Comparison
# Tests all CfC variants with key continual learning methods

python_cmd: python
venv_path: ../.venv/bin/activate
base_path: ./mammoth

global_args:
  n_epochs: 10
  batch_size: 32
  num_workers: 0
  savecheck: task
  enable_other_metrics: true

datasets:
  - seq-mnist
  - seq-cifar10

models:
  - sgd
  - er
  - derpp
  - lwf
  - ewc_on

backbones:
  - mnistcfc      # NCP-wired CfC for MNIST
  - cnn-cfc       # NCP-wired CfC for CIFAR

seeds:
  - 0
  - 42
  - 123

model_args:
  er:
    buffer_size: 500
    minibatch_size: 32
  
  derpp:
    buffer_size: 500
    alpha: 0.1
    beta: 0.5
  
  lwf:
    alpha: 0.5
    softmax_temp: 2.0
  
  ewc_on:
    e_lambda: 100
    gamma: 1.0

backbone_args:
  mnistcfc:
    input_size: 784
    output_size: 10
    hidden_size: 256
    use_ncp_wiring: 1
    chunk_size: 28
  
  cnn-cfc:
    hidden_size: 256
    use_ncp_wiring: 1

dataset_args:
  seq-mnist:
    lr: 0.03
  
  seq-cifar10:
    lr: 0.01
