model: hope
backbone: hope
dataset: seq-cifar10
n_epochs: 10
lr: 0.1
batch_size: 32
buffer_size: 0  # No replay for this test
load_best_args: false
output_dir: ./validation_hope_epochs

model_args:
    alpha: 0.5  # Memory update rate
    beta: 0.5   # Teacher signal weight

backbone_args:
    hidden_dim: 128
    key_dim: 64
    memory_layers: 3
    surprise_threshold: 0.15
    momentum: 0.9
