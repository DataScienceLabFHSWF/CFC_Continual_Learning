# MNIST Baseline Validation - Compare CfC against standard Mammoth methods
# Tests multiple continual learning methods with standard MLP backbone

python_cmd: python
venv_path: ../.venv/bin/activate
base_path: ./mammoth

gpus:
  - 0
  - 1

global_args:
  n_epochs: 1
  batch_size: 32
  num_workers: 0

datasets:
  - seq-mnist

# Standard Mammoth baselines for comparison
models:
  - sgd          # Fine-tuning baseline (catastrophic forgetting)
  - er           # Experience Replay
  - derpp        # Dark Experience Replay++
  - er-ace       # ER with Asymmetric Cross-Entropy

seeds:
  - 0

# Standard MLP backbone (Mammoth default for MNIST)
backbones:
  - mnistmlp

model_args:
  er:
    buffer_size: 200
  derpp:
    buffer_size: 200
    alpha: 0.1
    beta: 0.5
  er-ace:
    buffer_size: 200

dataset_args:
  seq-mnist:
    lr: 0.03
