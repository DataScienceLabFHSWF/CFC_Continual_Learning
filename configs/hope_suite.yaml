
# ============================================================================
# HOPE Benchmark Suite
# ============================================================================
# Explicit list of experiments for HOPE vs Baselines across datasets.

venv_path: /home/fneubuerger/CFC_Continual_Learning/.venv/bin/activate

# GPU assignment (repeated to allow multiple jobs per GPU)
gpus: [0, 0, 1, 1]

global_args:
  num_workers: 4
  wandb_entity: fneubuerger
  wandb_project: mammoth
  
explicit_experiments:
  # --- CIFAR-10 ---
  - dataset: seq-cifar10
    model: hope
    backbone: hope
    seeds: [0]
    args:
      input_size: 32
      input_channels: 3
      n_epochs: 50
      batch_size: 32
      hope_lr: 0.001
      lr: 0.001

  - dataset: seq-cifar10
    model: er
    backbone: resnet18_vanilla
    seeds: [0]
    args:
      n_epochs: 50
      batch_size: 32
      buffer_size: 500
      lr: 0.03

  # --- MNIST ---
  - dataset: seq-mnist
    model: hope
    backbone: hope
    seeds: [0]
    args:
      input_size: 28
      input_channels: 1
      n_epochs: 10
      batch_size: 32
      hope_lr: 0.001
      lr: 0.001

  - dataset: seq-mnist
    model: er
    backbone: mnistmlp
    seeds: [0]
    args:
      n_epochs: 10
      batch_size: 32
      buffer_size: 200
      lr: 0.03

  # --- CIFAR-100 ---
  - dataset: seq-cifar100
    model: hope
    backbone: hope
    seeds: [0]
    args:
      input_size: 32
      input_channels: 3
      n_epochs: 50
      batch_size: 32
      hope_lr: 0.001
      lr: 0.001

  - dataset: seq-cifar100
    model: er
    backbone: resnet18_vanilla
    seeds: [0]
    args:
      n_epochs: 50
      batch_size: 32
      buffer_size: 500
      lr: 0.03
