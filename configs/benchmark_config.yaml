# Full Benchmark Configuration for CfC Continual Learning
# This runs comprehensive benchmarks across all CfC architectures and baseline models

# Python environment
python_cmd: python
venv_path: ../.venv/bin/activate
base_path: ./mammoth

# Global arguments applied to all experiments
global_args:
  n_epochs: 10
  batch_size: 32
  num_workers: 0
  savecheck: task
  enable_other_metrics: true

# Datasets to benchmark
datasets:
  - seq-mnist
  - seq-cifar10
  - seq-cifar100

# Models to test
models:
  - sgd           # Simple baseline
  - er            # Experience Replay
  - derpp         # Dark Experience Replay++
  - lwf           # Learning without Forgetting
  - ewc_on        # Elastic Weight Consolidation (online)
  - icarl         # Incremental Classifier and Representation Learning

# Backbones to test
backbones:
  - mnistcfc      # CfC for MNIST
  - cnn-cfc       # CfC for CIFAR
  - resnet18      # Standard ResNet baseline
  - mlp           # Simple MLP baseline

# Random seeds for reproducibility
seeds:
  - 0
  - 42
  - 123

# Model-specific arguments
model_args:
  er:
    buffer_size: 500
    minibatch_size: 32
  
  derpp:
    buffer_size: 500
    alpha: 0.1
    beta: 0.5
  
  lwf:
    alpha: 0.5
    temperature: 2.0
  
  ewc_on:
    e_lambda: 100
    gamma: 1.0
  
  icarl:
    buffer_size: 500
    lr: 0.1

# Backbone-specific arguments
backbone_args:
  mnistcfc:
    input_size: 784
    output_size: 10
    hidden_size: 256
    use_ncp_wiring: 1
    chunk_size: 28
  
  cnn-cfc:
    hidden_size: 256
    use_ncp_wiring: 1
  
  resnet18:
    # ResNet uses default args

# Dataset-specific arguments
dataset_args:
  seq-mnist:
    lr: 0.03
  
  seq-cifar10:
    lr: 0.01
  
  seq-cifar100:
    lr: 0.01
