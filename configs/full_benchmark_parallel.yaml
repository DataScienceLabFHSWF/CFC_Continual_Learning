# Full Parallel Benchmark Configuration
# Runs all experiments across MNIST, CIFAR, and TEP with parallel execution

python_cmd: python
venv_path: ../.venv/bin/activate
base_path: ./mammoth

# GPU configuration for parallel execution
gpus:
  - 0
  - 1

# Global arguments
global_args:
  n_epochs: 20
  batch_size: 32
  num_workers: 0
  savecheck: task
  enable_other_metrics: true

# All datasets
datasets:
  - seq-mnist
  - seq-cifar10
  - tennessee-eastman

# Continual learning methods
models:
  - sgd
  - er
  - derpp
  - lwf
  - ewc_on
  - icarl

# Backbones
backbones:
  - mnistcfc      # CfC for MNIST
  - cnn-cfc       # CfC for CIFAR
  - tepcfc        # CfC for TEP
  - resnet18      # Standard baseline

# Seeds
seeds:
  - 0
  - 42
  - 123

# Model-specific arguments
model_args:
  er:
    buffer_size: 500
    minibatch_size: 32
  
  derpp:
    buffer_size: 500
    alpha: 0.1
    beta: 0.5
  
  lwf:
    alpha: 0.5
    softmax_temp: 2.0
  
  ewc_on:
    e_lambda: 100
    gamma: 1.0
  
  icarl:
    buffer_size: 500

# Backbone-specific arguments
backbone_args:
  mnistcfc:
    input_size: 784
    output_size: 10
    hidden_size: 256
    use_ncp_wiring: 1
    chunk_size: 28
  
  cnn-cfc:
    hidden_size: 256
    use_ncp_wiring: 1
  
  tepcfc:
    input_size: 52
    output_size: 21
    hidden_size: 128
    use_ncp_wiring: 1
  
  resnet18:
    # Uses defaults

# Dataset-specific arguments
dataset_args:
  seq-mnist:
    lr: 0.03
  
  seq-cifar10:
    lr: 0.01
  
  tennessee-eastman:
    lr: 0.001

# Traditional ML for TEP
traditional_ml:
  models:
    - xgboost
    - lightgbm
    - random_forest
  
  datasets:
    - tennessee-eastman
  
  seeds:
    - 0
    - 42
    - 123
  
  args:
    output_dir: tep_ml_results
  
  model_args:
    xgboost:
      n_estimators: 100
      max_depth: 6
      learning_rate: 0.1
    
    lightgbm:
      n_estimators: 100
      max_depth: 6
      learning_rate: 0.1
    
    random_forest:
      n_estimators: 100
      max_depth: 10
