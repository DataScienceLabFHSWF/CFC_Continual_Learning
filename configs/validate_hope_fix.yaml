# HOPE Validation Config

python_cmd: python
venv_path: ../.venv/bin/activate
base_path: ./mammoth

gpus:
  - 0

global_args:
  n_epochs: 2
  batch_size: 32
  num_workers: 0

datasets:
  - seq-cifar10

models:
  - hope

backbones:
  - hope

seeds:
  - 0

model_args:
  hope:
    hope_lr: 0.001

dataset_args:
  seq-cifar10:
    lr: 0.001

backbone_args:
  hope:
    input_size: 32
    input_channels: 3
    num_classes: 10
    dim: 64
    depth: 1
    heads: 4
    surprise_threshold: 0.001
