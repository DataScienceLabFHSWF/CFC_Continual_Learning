# ============================================================================
# HOPE (Nested Learning) Benchmark Configuration
# ============================================================================
# Benchmarking the HOPE architecture and Nested Learning strategy.

common:
  num_workers: 4
  seed_range: [0] # Start with 1 seed for testing

# ============================================================================
# CIFAR-10 (Vision)
# ============================================================================
cifar10:
  dataset: seq-cifar10
  n_epochs: 50
  batch_size: 32
  buffer_size: 500
  
  experiments:
    # HOPE Model with HOPE Backbone
    - backbone: hope
      models:
        - name: hope
          args:
            hope_lr: 0.001
            lr: 0.001
            
    # Baseline: ER + ResNet18
    - backbone: resnet18_vanilla
      models:
        - name: er
          args:
            lr: 0.03

# ============================================================================
# MNIST (Vision)
# ============================================================================
mnist:
  dataset: seq-mnist
  n_epochs: 10
  batch_size: 32
  buffer_size: 200
  
  experiments:
    # HOPE Model with HOPE Backbone
    - backbone: hope
      models:
        - name: hope
          args:
            hope_lr: 0.001
            lr: 0.001
            
    # Baseline: ER + MLP
    - backbone: mnistmlp
      models:
        - name: er
          args:
            lr: 0.03

# ============================================================================
# CIFAR-100 (Vision)
# ============================================================================
cifar100:
  dataset: seq-cifar100
  n_epochs: 50
  batch_size: 32
  buffer_size: 500
  
  experiments:
    # HOPE Model with HOPE Backbone
    - backbone: hope
      models:
        - name: hope
          args:
            hope_lr: 0.001
            lr: 0.001
            
    # Baseline: ER + ResNet18
    - backbone: resnet18_vanilla
      models:
        - name: er
          args:
            lr: 0.03
